name: Release

# Publica un release al empujar una etiqueta vX.Y.Z o vX.Y.Z-pre (ADR-0016).
# Las etiquetas con sufijo (-alpha.1, -rc.1…) quedan como prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar la etiqueta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: La etiqueta apunta a un commit de main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: go test
        run: go test ./...
      - name: Prueba de humo del ejecutable
        run: ./scripts/smoke.sh

  publish:
    name: Publicar ejecutables
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Empaquetar
        run: ./scripts/release.sh "$GITHUB_REF_NAME" dist
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          {
            echo "Ejecutables de BalanzaPro $GITHUB_REF_NAME para Windows y Linux (amd64)."
            echo
            echo "**No apto para producción.** Descargue el .zip (Windows) o el .tar.gz (Linux), compruebe la suma en SHA256SUMS y siga la guía [Instalar y probar](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/user-guide/instalar.md)."
            echo
            echo "El ejecutable no está firmado: Windows SmartScreen puede advertirlo la primera vez."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --title "BalanzaPro $GITHUB_REF_NAME" --notes-file notes.md --generate-notes $pre
