name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formato, vet y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy sin cambios
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet (Linux y Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Reglas de dependencias entre capas
        run: ./scripts/check-domain-deps.sh

  test-linux:
    name: Pruebas (Linux, SQLite y PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales de un contenedor efímero de CI, no de un entorno real.
      BALANZAPRO_TEST_POSTGRES_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/postgres?sslmode=disable
      BALANZAPRO_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: Prueba de humo del ejecutable
        env:
          BALANZAPRO_SMOKE_POSTGRES_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/postgres?sslmode=disable
        run: ./scripts/smoke.sh

  test-windows:
    name: Pruebas (Windows, SQLite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...
      - name: Prueba de humo del ejecutable
        shell: bash
        run: ./scripts/smoke.sh

  build:
    name: Compilación ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [checks]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...

  security:
    name: Vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
